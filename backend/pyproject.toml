[project]
name = "mslearn-video-documenter"
version = "0.1.0"
description = "AI-powered agent that transforms screen recording videos into MS Learn-style documentation"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.11.0,<2",
    "agent-framework-foundry>=1.10.0,<2",
    # Pin openai chat client below 1.11.0: 1.11.0 unconditionally appends
    # "reasoning.encrypted_content" to the Responses API `include` list for
    # stateless requests, which non-reasoning models (gpt-4.1-mini, gpt-4o)
    # reject with a 400. See issue #124.
    "agent-framework-openai>=1.10.0,<1.11.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "azure-identity>=1.19.0",
    "azure-storage-blob>=12.24.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    "aiohttp>=3.9.0",
    "charset-normalizer>=3.0.0",
    "mcp>=1.9.0",
    "markitdown[docx,pdf,pptx]>=0.1.0",
]

[project.optional-dependencies]
local = [
    "openai-whisper>=20240930",
    "opencv-python-headless>=4.10.0",
    "scenedetect[opencv]>=0.6.5",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
    "pyinstaller>=6.0.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",
    "python-pptx>=1.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "cloud: tests requiring Azure cloud services",
    "local: tests for local-mode processing",
    "integration: integration tests requiring external services",
    "slow: slow tests (>10s)",
    "eval: agent evaluation tests (require real services)",
    "style: rule-based MS Learn style compliance checks",
    "grounding: transcript-to-document grounding checks",
    "unit: fast unit tests for graders and utilities",
]
