name: Build VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install npm dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Build backend executable
        working-directory: backend
        run: pyinstaller --noconfirm backend.spec

      - name: Bundle backend into extension
        shell: pwsh
        run: |
          # PyInstaller onedir produces dist/backend/ directory
          Copy-Item -Recurse -Force backend\dist\backend vscode-extension\backend
          if (-not (Test-Path vscode-extension\backend\backend.exe)) {
            Write-Error "backend.exe not found in bundle"
            exit 1
          }

      - name: Create release directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path release -Force | Out-Null

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx vsce package --out ../release/ --allow-missing-repository --skip-license

      - name: Clean up bundled backend
        shell: pwsh
        run: Remove-Item -Recurse -Force vscode-extension\backend -ErrorAction SilentlyContinue

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: release/*.vsix
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.vsix
          generate_release_notes: true
